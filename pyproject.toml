[project]
name = "agent-triage-eval"
version = "0.1.0"
description = "Regression-gated evaluation harness for AI support agent triage"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["anthropic>=0.40"]  # only needed for --provider anthropic
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
