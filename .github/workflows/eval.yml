name: agent-triage-eval

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Model behaviour drifts without any change to this repo. A weekly run
    # against the live provider is how that gets noticed before a customer
    # notices it.
    - cron: "0 6 * * 1"

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: PYTHONPATH=src python -m pytest -q

  eval-offline:
    name: eval gate (offline)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deterministic provider, no API key, no spend. Runs on every PR from a
      # fork. This is what makes the gate a required check rather than an
      # optional one.
      - name: Run eval against committed baseline
        run: PYTHONPATH=src python -m compeval.runner --provider mock --runs 3 --gate

      - name: Prove the gate actually blocks a regression
        run: |
          if PYTHONPATH=src python -m compeval.runner \
               --provider mock --runs 3 --hard-accuracy 0.80 --gate >/dev/null 2>&1; then
            echo "::error::A degraded model passed the gate. The gate is broken."
            exit 1
          fi
          echo "Gate correctly rejected the degraded model."

      - name: Publish report to job summary
        if: always()
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: results/

  eval-live:
    name: eval gate (live model)
    runs-on: ubuntu-latest
    needs: unit
    # Secrets are unavailable to fork PRs, so this is scheduled and main-branch
    # only. Never let a job that needs a secret be a required check on external
    # contributions.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The offline gate above is the required check. This job is additive, so
      # it reports "not configured" rather than failing a build for the absence
      # of a key the repo does not require.
      - name: Check for a provider key
        id: key
        run: |
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "provider=groq" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "provider=anthropic" >> "$GITHUB_OUTPUT"
          else
            echo "provider=" >> "$GITHUB_OUTPUT"
            echo "No live provider key configured; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Anthropic SDK
        if: steps.key.outputs.provider == 'anthropic'
        run: pip install anthropic

      - name: Run eval against a live model
        if: steps.key.outputs.provider != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PYTHONPATH=src python -m compeval.runner \
            --provider ${{ steps.key.outputs.provider }} --runs 3 \
            --out results/live

      - name: Publish report to job summary
        if: steps.key.outputs.provider != ''
        run: cat results/live/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.provider != ''
        with:
          name: eval-report-live
          path: results/live/
